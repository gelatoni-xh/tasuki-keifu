services:
  postgres:
    image: postgres:17-alpine
    container_name: tasuki-keifu-postgres
    environment:
      POSTGRES_DB: tasuki_keifu
      POSTGRES_USER: tasuki_keifu
      POSTGRES_PASSWORD: tasuki_keifu
    ports:
      - "5432:5432"
    volumes:
      - tasuki-keifu-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasuki_keifu -d tasuki_keifu"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tasuki-keifu-postgres-data:
