services:
  app:
    image: ${TASUKI_KEIFU_IMAGE:-tasuki-keifu-app:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tasuki-keifu-app
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: "1"
      TASUKI_LOG_RETENTION_DAYS: "3"
    ports:
      - "127.0.0.1:3020:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/ja').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: local
      options:
        max-file: "3"
        max-size: "10m"

  postgres:
    image: postgres:17-alpine
    container_name: tasuki-keifu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tasuki_keifu
      POSTGRES_USER: tasuki_keifu_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - tasuki-keifu-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasuki_keifu_user -d tasuki_keifu"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tasuki-keifu-postgres-data:
